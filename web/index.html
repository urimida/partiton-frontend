<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <!-- 모바일 Safari 주소줄·상단 여백: 흰색 대신 앱 배경과 맞춤 -->
  <meta name="theme-color" content="#060F18" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#0B1520">
  <meta name="description" content="A new Flutter project.">
  <!-- 마이크(음성 질문)·카메라(영수증 등) — 브라우저가 동일 출처에서 권한 요청할 수 있게 허용 (HTTPS 또는 localhost 필요) -->
  <meta http-equiv="Permissions-Policy" content="microphone=(self), camera=(self)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="partition_app">
  <link rel="apple-touch-icon" href="partition-logo.png">

  <!-- Favicon (브라우저 탭) -->
  <link rel="icon" type="image/png" href="partition-logo.png"/>

  <title>partition_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #060F18;
    }
    /* Flutter Web 캔버스 바깥(특히 iOS 노치 상단)에 기본 흰 배경이 보이지 않게 */
    flt-scene-host, flutter-view,
    flt-glass-pane, flt-semantics-placeholder {
      background-color: transparent;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
