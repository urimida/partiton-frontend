name: partition_app
description: A Flutter application for partition management with Spring backend integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 상태 관리
  provider: ^6.1.1
  
  # HTTP 통신
  http: ^1.1.0
  dio: ^5.4.0
  
  # 로컬 저장소
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # JSON 직렬화
  json_annotation: ^4.8.1
  
  # UI 관련
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # 유틸리티
  logger: ^2.0.2+1
  
  # 카카오 SDK
  kakao_flutter_sdk_common: ^1.3.0
  kakao_flutter_sdk_user: ^1.3.0
  kakao_flutter_sdk_auth: ^1.3.0
  
  # 폼 검증 (필요시 주석 해제)
  # flutter_form_builder: ^9.1.1
  # form_builder_validators: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/background.png
    - assets/images/Bottom-bar-bg.png
    - assets/icons/
    - assets/fonts/
  
  # Fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf

